services:
  - type: web
    name: babycare-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: AI_API_KEY
        value: sk-iQ95N7rriRYBYBBrnCDwDCL0VHTzwb4IixblKROuRGaI31VW
      - key: AI_API_BASE
        value: https://api.deepseek.com/v1
      - key: AI_MODEL
        value: deepseek-chat
      # 腾讯云 ASR 密钥 — 请替换为真实值
      # 申请地址：https://console.cloud.tencent.com/cam/capi
      - key: TENCENT_SECRET_ID
        value: your-secret-id-here
      - key: TENCENT_SECRET_KEY
        value: your-secret-key-here
